name: Update data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分鐘以 yfinance / FinMind 重新計算（GitHub 排程可能延遲數分鐘）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Fetch live signals (yfinance + FinMind)
        working-directory: backend
        env:
          TA_USE_LIVE_DATA: "true"
          TA_FETCHER_TIMEOUT_SEC: "45"
          TA_FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # 讀回目前線上的 history.json 接續累積總分走勢（第一次部署時不存在，會自動從頭開始）
          TA_HISTORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/history.json
        run: python -m scripts.export_snapshot ../frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_DATA_MODE: static
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
